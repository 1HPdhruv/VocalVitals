<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VocalVitals — real-time respiratory health screening with personal baseline tracking.">
    <title>VocalVitals — Respiratory Screening Prototype</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://unpkg.com/meyda/dist/web/meyda.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>VocalVitals</h1>
            <p>Respiratory screening prototype · <span id="model-version-badge">v4</span></p>
        </header>

        <!-- Auth panel -->
        <section class="auth-panel" id="auth-panel">
            <div class="tab-bar">
                <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Login</button>
                <button class="tab-btn" id="tab-register" onclick="showTab('register')">Register</button>
            </div>
            <div id="login-form">
                <input id="login-email" type="email" placeholder="Email" class="input-field" />
                <input id="login-password" type="password" placeholder="Password" class="input-field" />
                <button class="btn primary" onclick="handleLogin()">Login</button>
            </div>
            <div id="register-form" style="display:none;">
                <input id="reg-email" type="email" placeholder="Email" class="input-field" />
                <input id="reg-password" type="password" placeholder="Password" class="input-field" />
                <button class="btn primary" onclick="handleRegister()">Create Account</button>
            </div>
            <p id="auth-error" class="error-msg"></p>
        </section>

        <!-- Main app panel (shown after login) -->
        <section class="app-panel" id="app-panel" style="display:none;">
            <div class="user-bar">
                <span id="user-email-label"></span>
                <button class="btn-link" onclick="handleLogout()">Logout</button>
            </div>

            <section class="controls">
                <button id="record-btn" class="btn primary">Start Recording</button>
                <button id="stop-btn" class="btn danger" disabled>Stop</button>
            </section>

            <section class="status-panel">
                <h2>Status</h2>
                <div id="status-text">Loading model…</div>
            </section>

            <section class="results-panel">
                <h2>Latest Result</h2>
                <div id="prediction-result">Waiting for audio…</div>
                <div class="baseline-info">
                    Baseline: <span id="baseline-status">Not established</span>
                </div>
            </section>

            <section class="history-panel">
                <h2>Session History</h2>
                <ul id="history-list" class="history-list"></ul>
            </section>
        </section>
    </div>

    <script src="api.js"></script>
    <script src="model.js"></script>
    <script src="app.js"></script>
</body>
</html>
